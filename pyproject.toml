[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "style-kb"
version = "0.1.0"
description = "CLI-first multimodal knowledge base ingestion for YouTube videos."
readme = "README.md"
requires-python = "==3.14.5"
dependencies = [
  "google-genai>=1.53.0",
  "Jinja2>=3.1.6",
  "openai>=1.100.0",
  "pydantic>=2.11.0",
  "PyYAML>=6.0.2",
  "scenedetect[opencv]>=0.6.7.1",
  "soniox>=0.4.0",
  "typer>=0.16.0",
]

[project.scripts]
style-kb = "style_kb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/style_kb"]
