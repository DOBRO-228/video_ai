project:
  name: mens-style-kb
  output_dir: ./mens-style-kb
  keep_media: false
  keep_frames: true

download:
  video_height: 720
  video_format: mp4
  audio_format: mp3
  audio_quality: "0"
  cookies_from_browser: null
  remote_components: ejs:github

stt:
  provider: soniox
  model: stt-async-v4
  mode: async_file
  language_hints:
    - ru
    - en
  language_hints_strict: false
  language_identification: true
  speaker_diarization: true
  speaker_role_strategy: longest_speech_host
  context:
    domain: "men's style, menswear, tailoring, suits, shoes, shirts, accessories, fit, fabrics, colors, proportions, grooming"
    terms:
      - "посадка"
      - "цветовая гамма"
      - "сочетание цветов"
      - "вытягивание роста"
      - "лен"
      - "хлопок"
      - "шерсть"
      - "тенсил"
      - "замша"
      - "кожа"
      - "рубашка"
      - "пиджак"
      - "брюки"
      - "галстук"
      - "пуговицы"
      - "ремень"
      - "аксессуары"
      - "манжеты"
      - "рукав"
      - "воротник"
      - "защипы"
      - "боковые регуляторы"
      - "подтяжки"
      - "крой"
      - "фланель"
      - "твид"
      - "текстура"
      - "шелк"
      - "вязаные изделия"
      - "рубашка-поло"
      - "духи"
      - "лацканы"
      - "дерби"
      - "оксфорды"
      - "броги"
      - "лоферы"
      - "smart casual"
      - "tailoring"
      - "fit"
      - "lapel"
      - "shoulder seam"
      - "trouser break"
      - "oxfords"
      - "derbies"
      - "brogues"
      - "loafers"
      - "pleats"
      - "cuffs"
      - "drape"
      - "silhouette"

scene_detection:
  detector: adaptive
  min_scene_len_seconds: 1.5
  keyframe_edge_inset_seconds: 0.35
  images_per_scene: 4
  extra_sample_every_seconds: 4
  max_frames_per_scene: 8
  intra_scene_dedup: true
  phash_max_distance: 8
  ssim_confirm: 0.85
  min_frames_per_scene: 1
  fallback_scene_seconds: 30
  frame_quality:
    enabled: true
    probe_window_seconds: 0.6
    probe_step_seconds: 0.3
    prefer_planned_timestamp_score_ratio: 0.92
    drop_low_quality: false
    min_quality_frames_per_scene: 1
    central_region_weight: 1.5
    grid_size: 4
    keep_rejected_probe_files: false
  palette_boundary_refinement:
    enabled: true
    sample_step_seconds: 0.25
    min_scene_duration_seconds: 6.0
    max_boundary_shift_seconds: 3.0
    min_segment_seconds: 1.5
    stable_window_seconds: 1.0
    edge_guard_seconds: 0.75
    min_saturation_delta: 30.0
    min_colorfulness_delta: 8.0
    min_histogram_distance: 0.25
    min_confidence: 0.75

vision:
  provider: gemini
  model: gemini-2.5-flash
  media_resolution: high
  thinking_level: null
  thinking_budget: 8192
  batch_size: 6
  # OpenAI values kept for rollback:
  # provider: openai
  # model: gpt-5-nano
  # detail: high
  presenter_bootstrap_enabled: true
  presenter_bootstrap_prompt_file: presenter_profile_ru.txt
  presenter_bootstrap_scene_limit: 12
  presenter_bootstrap_max_images: 12
  presenter_low_confidence_disables_recurrence: true
  include_nearby_transcript: true
  transcript_context_before_seconds: 5
  transcript_context_after_seconds: 2
  ocr: true
  prompt_file: visual_menswear_ru.txt

speech_segmentation:
  provider: openai
  model: gpt-5-mini
  retry_advisor_model: gpt-5-mini
  retry_advisor_prompt_file: speech_segments_retry_advisor_ru.txt
  prompt_file: speech_segments_semantic_ru.txt
  max_segment_seconds: 60
  min_segment_seconds: 5
  pause_break_ms: 900
  max_segment_words: 150

chunking:
  mode: llm_speech_plan
  provider: openai
  model: gpt-5-mini
  retry_advisor_model: gpt-5-mini
  retry_advisor_prompt_file: chunk_plan_retry_advisor_ru.txt
  prompt_file: chunk_plan_ru.txt
  max_words: 1000
  max_speech_segments_per_chunk: 8
  question_answer_merge_seconds: 12
  visual_attach_seconds: 5
  max_planner_segments_per_call: 80
  planner_context_segments: 3
  planner_parallel_requests: 4
  max_retries: 3
  title_max_chars: 80
  boundary_reason_max_chars: 160
  notes_max_chars: 240
  topic_max_chars: 80
  max_topics: 6

style_claims:
  provider: openai
  model: gpt-5-mini
  retry_advisor_model: gpt-5-mini
  retry_advisor_prompt_file: style_claims_retry_advisor_ru.txt
  prompt_file: style_claims_ru.txt
  max_claims_per_chunk: 5
  max_retries: 3
  curate:
    enabled: true
    provider: openai
    model: gpt-5-mini
    prompt_file: style_claims_curate_ru.txt
    reasoning_effort: medium
    max_retries: 1

export:
  formats:
    - jsonl
    - obsidian
